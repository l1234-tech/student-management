# Назначение: статика SPA + proxy API; вход HTTP, выход dist/index.html или ответ backend.
# TODO: При изменении сервиса/порта согласовать proxy_pass с compose.yaml; /api сохранять целиком.
# Взаимодействует с Dockerfile и Vue Router history. JWT/роли USER/ADMIN проверяет backend,
# proxy не должен добавлять токен или изображать вход; поля DTO передаются без изменения.
# Проверка: reload /students/100000/edit даёт SPA; /api/auth/me даёт JSON 401, а не index.html.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # TODO: После подключения JWT проверить передачу Authorization и корректный статус 401/403.
    }

    location / {
        try_files $uri $uri/ /index.html;
        # TODO: Не переносить fallback в /api/: ошибки API должны сохранять серверный статус.
    }
}
