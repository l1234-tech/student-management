# Конфигурация Spring Boot приложения: порт, подключение к БД, JPA, JWT и логирование.
# Значения берутся из переменных окружения, пример которых лежит в .env.example.

server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: student-management
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/student_management}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      jakarta.persistence.provider: org.eclipse.persistence.jpa.PersistenceProvider

app:
  jwt:
    access-secret: ${JWT_ACCESS_SECRET:change-me-access-secret}
    refresh-secret: ${JWT_REFRESH_SECRET:change-me-refresh-secret}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}

logging:
  level:
    root: info
    dev.geeks.studentmanagement: debug
