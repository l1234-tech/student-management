name: Format and test

on:
  push:
    branches: [syrch]
    paths:
      - "1-2 lab/**"
      - "3 lab/**"
      - ".github/workflows/lab3-tests.yml"
  pull_request:
    paths:
      - "1-2 lab/**"
      - "3 lab/**"
      - ".github/workflows/lab3-tests.yml"

permissions:
  contents: write

concurrency:
  group: format-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: syrch
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: "3 lab/pom.xml"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Format Python with Black (PEP 8)
        run: |
          python -m pip install --disable-pip-version-check black
          black "1-2 lab"
      - name: Format Java with Spotless
        working-directory: 3 lab
        run: mvn --batch-mode --no-transfer-progress spotless:apply
      - name: Format JavaScript, HTML and CSS with Prettier
        run: |
          npx --yes prettier@3.3.3 --write "1-2 lab/**/*.{js,html,css}" "3 lab/src/main/resources/static/**/*.{js,css}" "3 lab/src/main/resources/templates/**/*.html"
      - name: Commit formatting changes
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "1-2 lab" "3 lab/src"
            git commit -m "Apply consistent code formatting"
            git push origin HEAD:syrch
          fi
      - name: Verify formatting
        run: |
          python -m pip install --disable-pip-version-check black
          black --check "1-2 lab"
          npx --yes prettier@3.3.3 --check "1-2 lab/**/*.{js,html,css}" "3 lab/src/main/resources/static/**/*.{js,css}" "3 lab/src/main/resources/templates/**/*.html"
        working-directory: .
      - name: Run tests
        working-directory: 3 lab
        run: mvn --batch-mode --no-transfer-progress test
