name: Lab 3 tests

on:
  push:
    branches: [main, syrch]
    paths:
      - "3 lab/**"
      - ".github/workflows/lab3-tests.yml"
  pull_request:
    paths:
      - "3 lab/**"
      - ".github/workflows/lab3-tests.yml"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 3 lab
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: "3 lab/pom.xml"
      - name: Format Java sources
        run: mvn --batch-mode --no-transfer-progress spotless:apply
      - name: Commit formatting changes
        run: |
          if ! git diff --quiet -- "3 lab/src"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "3 lab/src"
            git commit -m "Format Java sources"
            git push
          fi
      - name: Run tests
        run: mvn --batch-mode --no-transfer-progress test
