name: Lab 3 tests

on:
  push:
    branches: [syrch]
    paths:
      - "3 lab/**"
      - ".github/workflows/lab3-tests.yml"
  pull_request:
    paths:
      - "3 lab/**"
      - ".github/workflows/lab3-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 3 lab
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: "3 lab/pom.xml"
      - name: Format Java sources
        run: mvn --batch-mode --no-transfer-progress spotless:check
      - name: Run tests
        run: mvn --batch-mode --no-transfer-progress test
