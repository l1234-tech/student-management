<!DOCTYPE html>

<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" href="images/favicon.jpg" type="image/jpg">
        <link rel="stylesheet" href="css/style.css">
        <title>
            Форма для досье
        </title>
    </head>

    <body>
        <nav>
            <a class="li a" href="index.html">Главная</a>
            <a class="li a" href="student.html">Досье студента</a>
            <a class="li a" href="student_form.html">Изменение/добавление досье</a>
        </nav>
        <br>
        <header>
            <h2>
            Форма записи
        </h2>
        </header>

        <main>
            <form>
                <label>ФИО студента:</label>
                <input 
                type="text"
                placeholder="Введите ФИО"
                required
                >

                <br>

                <label>Группа:</label>
                <input 
                type="text"
                placeholder="Введите группу"
                required
                >

                <br>

                <label>ИСУ id:</label>
                <input 
                type="number"
                placeholder="ИСУ id"
                required
                >

                <br>

                <label>номер общежития:</label>
                <input 
                type="number"
                placeholder="Введите номер общежития"
                required
                >

                <br>

                <label>комната:</label>
                <input 
                type="number"
                placeholder="Введите номер комнаты"
                required
                >

                <br>

                <label>срок заселения:</label>
                <input 
                type="date"
                placeholder="Введите срок заселения"
                required
                >

                <br>

                <label>Является ли студент иностранцем?</label>
                <input 
                type="checkbox"
                >

                <br>

                <label>Заметки</label>
                <textarea>
                    Введите описание
                </textarea>
                >
            </form>
        </main>
        <footer>
            <p>Сайтик</p>
        </footer>
    </body>
</html>
