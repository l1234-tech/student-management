<!DOCTYPE html>

<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" href="images/favicon.jpg" type="image/jpg">
        <link rel="stylesheet" href="css/style.css">
        <title>
            Форма для досье
        </title>
    </head>

    <body>
        <main>
            <div>
                <nav>
                    <a class="li a" href="index.html">Главная</a>
                    <a class="li a" href="student.html">Досье студента</a>
                    <a class="li a" href="student_form.html">Изменение/добавление досье</a>
                </nav>
            </div>

            <div>
                <header>
                    <h1>
                        Форма записи
                    </h1>
                </header>
            </div>
            <div>
                <form id="UsersForm">
                    <label for="full-name">ФИО студента:</label>
                    <input
                    id="full-name" 
                    type="text"
                    placeholder="Введите ФИО"
                    required
                    >

                    <br>

                    <label for="group">Группа:</label>
                    <input 
                    id="group"
                    type="text"
                    placeholder="Введите группу"
                    required
                    >

                    <br>

                    <label for="ISU">ИСУ id:</label>
                    <input 
                    id="ISU"
                    type="number"
                    placeholder="ИСУ id"
                    required
                    >

                    <br>

                    <label for="number-house">Номер общежития:</label>
                    <input 
                    id="number-room"
                    type="number"
                    placeholder="Введите номер общежития"
                    required
                    >

                    <br>

                    <label for="number-room">Комната:</label>
                    <input 
                    id="number-room"
                    type="number"
                    placeholder="Введите номер комнаты"
                    required
                    >

                    <br>

                    <label for="date">Срок заселения:</label>
                    <input 
                    id="date"
                    type="date"
                    placeholder="Введите срок заселения"
                    required
                    >

                    <br>

                    <label for="inostran">Является ли студент иностранцем?</label>
                    <input 
                    id="inostran"
                    type="checkbox"
                    >

                    <br>

                    <label for="note">Заметки</label>
                    <textarea
                        id="note"
                        placeholder="Введите описание">
                    </textarea>
                    >
                </form>
            </div>
        </main>
        <footer>
            <p>Сайтик</p>
        </footer>
    </body>
</html>
