{% load static %}
<!DOCTYPE html>

<html lang="ru">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" href="static/images/favicon.jpg" type="image/jpg">
        <link rel="stylesheet" href="{% static 'css/style.css' %}">
        <title>
            Управление студентами
        </title>
    </head>
    <body>
        <div class="nav-list">
            <nav class="nav">
                <ul  class="nav-list">
                    <a class="nav-link" href="{% url 'index' %}">Главная</a>
                    <a class="nav-link" href="{% url 'student-form' %}">Добавление студента</a>
                </ul>
            </nav>
        </div>
        <div>
            <header>
                <h1 id="title">
                    Список студентов
                </h1>
            </header>
        </div>
        <main>
            <div class="container-div">
                <button class="add-button" onclick=window.location.href="{% url 'student-form' %}" >
                    Добавить нового студента
                </button>
            </div>
            <div>
                <table class="table">
                    <thead>
                        <tr>
                            <th> ФИО студента </th>
                            <th> Группа </th>
                            <th> ИСУ id </th>
                            <th> Действия</th>
                        </tr>
                    </thead>
                    <tbody id="student-table">
                    </tbody>
                </table>
            </div>

        </main>
        <footer class="site-footer">
            Веб программирование 2026
        </footer>
        <script src="{% static 'js/student_form.js' %}"></script>
    </body>
</html>
