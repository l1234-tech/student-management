{% load static %}
<!doctype html>

<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="static/images/favicon.jpg" type="image/jpg" />
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
    <title>Управление студентами</title>
  </head>
  <body>
    <div class="nav-list">
      <nav class="nav">
        <ul class="nav-list">
          <a class="nav-link" href="{% url 'index' %}">Главная</a>
          <a class="nav-link" href="{% url 'student-form' %}"
            >Добавление студента</a
          >
        </ul>
      </nav>
    </div>
    <div>
      <header>
        <h1 id="title">Список студентов</h1>
      </header>
    </div>
    <main>
      <div class="container-div">
        <button class="add-button" data-url="{% url 'student-form' %}">
          Добавить нового студента
        </button>
      </div>
      <form id="filter-form" class="filter-form">
        <div class="filter-group">
          <label for="filter-isu">ИСУ</label>
          <input
            id="filter-isu"
            name="ISU"
            type="number"
            min="100000"
            max="999999"
          />
        </div>
        <div class="filter-group">
          <label for="filter-name">ФИО</label>
          <input id="filter-name" name="name" type="text" />
        </div>
        <div class="filter-group">
          <label for="filter-group">Группа</label>
          <input id="filter-group" name="group" type="text" />
        </div>
        <div class="filter-group">
          <label for="filter-dormitory">Общежитие</label>
          <input
            id="filter-dormitory"
            name="dormitory"
            type="number"
            min="1"
            max="20"
          />
        </div>
        <div class="filter-group">
          <label for="filter-room">Комната</label>
          <input
            id="filter-room"
            name="room"
            type="number"
            min="1000"
            max="9999"
          />
        </div>
        <div class="filter-group">
          <label for="filter-foreign">Иностранец</label>
          <select id="filter-foreign" name="is_foreign">
            <option value="">Любой</option>
            <option value="true">Да</option>
            <option value="false">Нет</option>
          </select>
        </div>
        <div class="filter-actions">
          <button type="submit" class="filter-button">Найти</button>
          <button type="reset" class="reset-button">Сбросить</button>
        </div>
      </form>
      <div>
        <table class="table">
          <thead>
            <tr>
              <th>ФИО студента</th>
              <th>Группа</th>
              <th>ИСУ id</th>
              <th>Действия</th>
            </tr>
          </thead>
          <tbody id="student-table"></tbody>
        </table>
      </div>
    </main>
    <footer class="site-footer">Веб программирование 2026</footer>
    <script src="{% static 'js/index.js' %}"></script>
  </body>
</html>
